  <body>
    <table>
      <tr><td><div><b>To create a link to this web site (like the one shown here), copy the HTML code snippet below. Then paste it into the appropriate location of your web page's HTML.</b></div></td></tr>

    <script> <!--
      function blockErr() {
        return true;
      }
      window.onerror=blockErr;
      function copyCode() {
        var codeCopy=document.getElementById("code");

        navigator.clipboard.writeText(codeCopy.value);
        document.execCommand("copy");
